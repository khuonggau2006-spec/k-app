services:
  postgres:
    image: postgres:16
    container_name: taskmgmt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmgmt_user
      POSTGRES_PASSWORD: taskmgmt_pass
      POSTGRES_DB: taskmgmt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taskmgmt-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis_pass"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taskmgmt-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taskmgmt.io
      PGADMIN_DEFAULT_PASSWORD: admin_pass
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redisinsight:
    image: redis/redisinsight:latest
    container_name: taskmgmt-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis

  minio:
    image: minio/minio:latest
    container_name: taskmgmt-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: taskmgmt_minio
      MINIO_ROOT_PASSWORD: taskmgmt_minio_pass
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000" # S3 API - chỉ backend .NET gọi tới, client mobile không bao giờ gọi trực tiếp
      - "9001:9001" # Web console để xem/quản lý bucket lúc dev
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
