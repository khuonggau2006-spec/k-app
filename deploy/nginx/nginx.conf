worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Khớp với Storage:MaxFileSizeBytes (20MB) bên backend - nếu đổi giới hạn file đính kèm thì
    # sửa cả 2 chỗ.
    client_max_body_size 20m;

    upstream taskmgmt_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name _; # Thay bằng domain thật, vd: api.taskmgmt.example.com

        # --- Chưa có domain/SSL thật: mọi traffic tạm đi qua HTTP ở đây. -----------------
        # Khi có domain + chứng chỉ (vd: qua certbot), thêm block "listen 443 ssl" bên dưới
        # (đã viết sẵn, đang comment) và bỏ comment dòng redirect HTTP->HTTPS.
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://taskmgmt_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR (/hubs/*) cần nâng cấp kết nối lên WebSocket, không dùng cấu hình proxy_pass
        # thường ở trên (thiếu Upgrade/Connection header sẽ làm SignalR tự rơi về long-polling,
        # vẫn chạy được nhưng chậm và tốn tài nguyên hơn hẳn).
        location /hubs/ {
            proxy_pass http://taskmgmt_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }

    # --- Mẫu HTTPS - bỏ comment và điền domain/đường dẫn cert khi có domain thật -----------
    # server {
    #     listen 443 ssl;
    #     server_name api.taskmgmt.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     location / {
    #         proxy_pass http://taskmgmt_api;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /hubs/ {
    #         proxy_pass http://taskmgmt_api;
    #         proxy_http_version 1.1;
